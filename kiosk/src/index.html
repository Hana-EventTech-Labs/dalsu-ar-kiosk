<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self';">
  <title>달수 AR 포토카드</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage" data-state="IDLE">
    <!-- 배경 (2026-09-06 클라이언트 확정): 하늘·구름 JPG(screen.idleBg). 그 위에 달수 대기 루프 영상(screen.idleVideo, 배경 포함)이 IDLE/GUIDE 에서 돈다.
         JPG 가 없거나 못 읽으면 아래 SVG 그라데이션이 그대로 보인다(폴백). 영상이 없으면 예전처럼 #stage-dalsu PNG 가 뜬다. -->
    <svg id="bg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#b3e8f6"/><stop offset="0.5" stop-color="#d9f3fa"/><stop offset="1" stop-color="#f0fafd"/>
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="34%" r="62%">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="1080" height="1920" fill="url(#sky)"/>
      <rect width="1080" height="1920" fill="url(#glow)"/>
      <g fill="#ffffff" opacity=".55">
        <circle cx="132" cy="742" r="13"/><circle cx="946" cy="612" r="10"/><circle cx="228" cy="1268" r="16"/>
        <circle cx="874" cy="1352" r="12"/><circle cx="520" cy="1616" r="9"/><circle cx="96" cy="1520" r="11"/>
      </g>
    </svg>
    <img id="bg-img" alt="" aria-hidden="true">
    <video id="idle-video" loop playsinline preload="auto" aria-hidden="true"></video>
    <!-- 물방울 이후 구간을 클라이언트 영상으로 대체하는 훅(screen.riverVideo) — 파일이 있을 때만 renderer 가 src 를 넣고 쓴다 -->
    <video id="river-video" playsinline preload="auto" aria-hidden="true"></video>
    <!-- 터짐 효과음(터짐 영상에서 추출한 WAV). file:// 에서는 fetch 가 안 되므로 <audio> 로 재생 -->
    <audio id="sfx-burst" preload="auto" aria-hidden="true"></audio>

    <!-- 웹캠 라이브 (카운트다운·촬영 단계에서만 표시) -->
    <!-- 뷰파인더: 촬영 미리보기를 포토카드 모양 틀 안에 보여준다(config.screen.viewfinder). 아래 여백은 자연·달수가 합성될 자리 -->
    <div id="viewfinder"><div class="vf-below"></div></div>
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="fx"></canvas>
    <!-- 뷰파인더 오버레이: 카드에 합성될 자연·달수를 라이브 영상 위에 그대로 겹친다 (인쇄와 같은 함수로 그림) -->
    <canvas id="vf-overlay"></canvas>

    <!-- 시안 1~4컷: 타이틀·부제는 대기~터치 단계 내내 상단 고정 -->
    <header id="head">
      <img id="head-title-img" alt="" aria-hidden="true">   <!-- 타이틀 그래픽(screen.titleImage) — 있으면 h1 대신 -->
      <h1 id="head-title"></h1>
      <p id="head-sub"></p>
    </header>

    <!-- 달수 PNG(대기 영상이 없을 때만 — 영상 안에 달수가 있다) -->
    <img id="stage-dalsu" alt="달수">

    <!-- 물방울 3개(Reduce/Reuse/Restore) — 대기 화면부터 바로 터치 가능(별도 시작 터치 없음, 2026-09-06 스펙) -->
    <div id="bubbles"></div>

    <!-- 물방울 터치 가이드(손가락 커서·안내 문구) — IDLE·GUIDE 모두 표시 -->
    <section id="guide" class="screen">
      <div id="guide-hand"></div>
      <p id="guide-text"></p>
    </section>

    <!-- 연출 단계 공통 캡션 -->
    <section id="story" class="screen"><p class="caption" id="story-text"></p>
      <!-- 달수가 지나가며 되살아나는 것과 4대 목표를 짝지어 한 줄씩 보여준다 (어린이 대상 설명) -->
      <div id="story-goal"><i id="story-goal-dot"></i><span id="story-goal-text"></span></div></section>

    <!-- 카운트다운 -->
    <section id="countdown" class="screen">
      <p class="caption" id="countdown-text"></p>
      <div id="count-num"></div>
    </section>

    <!-- 미리보기 + 출력 (시안 8컷) -->
    <section id="preview" class="screen">
      <p class="caption big" id="preview-title"></p>
      <canvas id="card" width="636" height="1012"></canvas>
      <div id="printer"></div>
      <div id="print-progress"><div id="print-bar"></div></div>
      <p class="caption" id="preview-text"></p>
    </section>

    <!-- 완료 / 오류 -->
    <section id="done" class="screen"><p class="caption big" id="done-text"></p></section>
    <section id="error" class="screen"><p class="caption big" id="error-text"></p><button id="error-reset">처음으로</button></section>

    <div id="build-tag"></div>
    <div id="flash"></div>
    <!-- 운영자 전용: 우상단 투명 영역 3회 연속 터치 시 앱 종료 (화면에는 보이지 않음) -->
    <div id="exit-hit" aria-hidden="true"></div>
  </div>
  <script src="flow.js"></script>
  <script src="compose.js"></script>
  <script src="river.js"></script>
  <script src="art.js"></script>
  <script src="water.js"></script>
  <script src="motion.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
